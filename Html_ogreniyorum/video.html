<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
</head>
<body>
    <!-- <video>: Web sayfasına video eklemek için kullanılan ana etikettir.
         src="videolar/Video.mp4": Oynatılacak video dosyasının yolunu (konumunu) belirtir.
         width="640": Videonun genişliğini piksel cinsinden ayarlar.
         controls: Kullanıcının videoyu oynatması, durdurması veya sesini açıp kapatması için kontrol butonlarını (oynat/durdur, ses, ilerleme çubuğu vb.) gösterir.
         autoplay: Sayfa açıldığı an videonun otomatik olarak oynamaya başlamasını sağlar (not: modern tarayıcılar genellikle 'muted' ile birlikte kullanılmazsa bunu engeller).
         muted: Videonun sessiz başlamasını sağlar (otomatik oynatma için tarayıcılar genelde bunu zorunlu kılar).
         loop: Video bittiğinde başa sararak sürekli tekrar etmesini (döngüye girmesini) sağlar. -->
    <video src="videolar/Video.mp4" width="640" controls autoplay muted loop>
    </video>
</body>
</html>

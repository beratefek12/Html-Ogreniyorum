<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ses Dosyası</title>
</head>
<body>
    <!-- <audio>: Web sayfasına ses dosyası (müzik veya ses efekti) eklemek için kullanılan etikettir.
         src="sesler/Ati242 - Sönen Sigaralar (Official Video).mp3": Oynatılacak ses dosyasının dosya yolunu ve adını belirtir.
         controls: Kullanıcının sesi oynatması, durdurması, ileri/geri sarması veya ses seviyesini ayarlaması için oynatıcı butonlarını gösterir.
         autoplay: Sayfa yüklendiği an sesin otomatik olarak çalmaya başlamasını sağlar.
         muted: Sesin başlangıçta sessiz (kapalı) başlamasını sağlar (modern tarayıcılar otomatik oynatma için genelde bunu şart koşar).
         loop: Ses bittiğinde başa dönerek şarkının veya sesin sürekli tekrar etmesini (döngüye girmesini) sağlar. -->
    <audio src="sesler/Ati242 - Sönen Sigaralar (Official Video).mp3" controls autoplay muted loop></audio>
</body>
</html>

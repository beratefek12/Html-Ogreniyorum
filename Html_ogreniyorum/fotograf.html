<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotograf</title>
</head>
<body>
    <!-- <a>: Web sayfasında bir bağlantı (link) oluşturur. 
         href="https://en.wikipedia.org/wiki/Kratos_(God_of_War)": Görsele tıklandığında gidilecek olan Wikipedia sayfasının adresini belirtir.
         target="_blank": Bağlantının yeni bir sekmede açılmasını sağlar. -->
    <a href="https://en.wikipedia.org/wiki/Kratos_(God_of_War)" target="_blank">
    
    <!-- <img>: Web sayfasına görsel (resim) eklemek için kullanılan etikettir.
         src="fotograflar/Kratos.png": Görsel dosyasının klasördeki yolunu ve adını belirtir.
         width="200px": Görselin genişliğini 200 piksel olarak ayarlar.
         alt="kratoss": Görsel yüklenmediğinde veya ekran okuyucular için alternatif bir açıklama metni sunar.
         title="Kratosun resmi": Fare imleci resmin üzerine getirildiğinde görünen ipucu (tooltip) yazısını belirler. -->
    <img src="fotograflar/Kratos.png"
    width="200px"
    alt="kratoss"
    title="Kratosun resmi" >
    </a>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlk Sayfa</title>
</head>
<!-- <body style="background-color:aqua">: Sayfanın arka plan rengini açık mavi (aqua) yapar. -->
<body style="background-color:aqua">
    
    <!-- <a>: Başka bir web sayfasına veya adrese bağlantı (link) vermeyi sağlar (anchor etiketi).
         style="color: ...; text-decoration: underline;": Linkin yazı rengini kırmızı tonlarında ayarlar ve altının çizili olmasını sağlar.
         href="https://www.youtube.com/": Linke tıklandığında gidilecek olan web adresini (URL) belirtir.
         title="Youtube'a gider": Fare imleci linkin üzerine getirildiğinde görünen ipucu (tooltip) yazısını belirler.
         target="_blank": Linke tıklandığında açılan sayfanın yeni bir sekmede açılmasını sağlar. -->
    <a style="color: rgba(255, 9, 9, 0.753); text-decoration: underline;" href="https://www.youtube.com/" 
    title="Youtube'a gider"    
    target="_blank"
    >Youtube</a >

    <!-- <p>: Web sayfasında düz metinler (paragraflar) oluşturmak için kullanılan etikettir. -->
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    <!--Lorem aslında sahte bir metindir Sadece denemek için kullanılır-->
</body>
</html>
